name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Get LLVM
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22 all
    - name: Set up Rust version
      run: |
        rustup update
        rustup override set stable
        rustup --version
    - name: Build
      run: cargo build -p compile --verbose
    - name: Clippy
      run: cargo clippy --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
