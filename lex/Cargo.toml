[package]
name = "lex"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal
span = { path = "../span" }
# External
regex = "1.12.2"
const_format = "0.2.35"
proptest-derive = { version = "0.8.0", optional = true }
proptest = { version = "1.11.0", optional = true }

[dev-dependencies]
proptest = "1.11.0"
proptest-derive = { version = "0.8.0" }
itertools = "0.14.0"

[lints]
workspace = true

[features]
test = ["dep:proptest-derive", "dep:proptest"]
