[package]
name = "parse"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal
span.path = "../span"
ident.path = "../ident"
ast.path = "../ast"
errors.path = "../errors"
# External
itertools = "0.14.0"
pretty_assertions = { version = "1.4.1", optional = true }
derive_more = { version = "2.1.1", features = ["from", "display"] }
smallvec = { version = "1.15.1", features = [
    "union",
    "const_generics",
    "const_new",
] }
smol_str = "0.3.6"
displaydoc = "0.2.5"
logos = "0.16.1"
proptest-derive = { version = "0.8.0", optional = true }
proptest = { version = "1.11.0", optional = true }

[dev-dependencies]
# Internal
# External
pretty_assertions = "1.4.1"
proptest = "1.11.0"
proptest-derive = "0.8.0"

[lints]
workspace = true

[features]
test = ["dep:proptest-derive", "dep:proptest"]
