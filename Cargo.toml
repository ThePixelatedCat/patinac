[workspace]
resolver = "3"
members = [
    "compile",
    "span",
    "ident",
    "errors",
    "parse",
    "ast",
    "nameres",
    "hir",
    "typecheck",
    "codegen",
]

[workspace.lints.clippy]
must_use_candidate = "allow"
single_match_else = "allow"
bool_to_int_with_if = "allow"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[workspace.lints.rust]
# missing_docs = "warn"
